name: Сборка Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Скачать исходники
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Установить Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Кэш Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Установить зависимости
        run: npm ci

      - name: Проверить приложение
        run: npm test

      - name: Собрать Windows-версию
        run: npm run build

      - name: Загрузить установщик
        uses: actions/upload-artifact@v4
        with:
          name: Peredyshka-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/peredyshka.exe
          if-no-files-found: error
